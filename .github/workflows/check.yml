name: check-parking
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: check-parking
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 check.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MATCH: ${{ secrets.MATCH }}
      - name: Save state
        run: |
          git config user.name "parking-bot"
          git config user.email "bot@users.noreply.github.com"
          # weekly heartbeat commit so GitHub never pauses the schedule for inactivity
          WEEK=$(date -u +%G-W%V)
          [ "$(cat heartbeat.txt 2>/dev/null)" = "$WEEK" ] || echo "$WEEK" > heartbeat.txt
          git add seen.json heartbeat.txt
          git diff --cached --quiet || (git commit -m "update seen" && git push)
